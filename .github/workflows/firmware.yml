name: firmware

# Builds the prebuilt firmware the setup app flashes (firmware/prebuilt/)
# whenever the firmware sources change, and commits it to the same branch,
# so nobody setting up boards needs ESP-IDF.

on:
  push:
    paths:
      - "firmware/**"
      - "!firmware/prebuilt/**"
      - "scripts/build_firmware.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write      # commit firmware/prebuilt
  actions: write       # start the tests on that commit

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python scripts/build_firmware.py
      - name: Commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Also needed by the rebase below, if the branch moved meanwhile.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A firmware/prebuilt
          if git diff --cached --quiet; then
            echo "prebuilt firmware unchanged"
            exit 0
          fi
          git commit -q -m "Firmware: rebuild prebuilt images" \
                        -m "Built by the firmware workflow from ${GITHUB_SHA}."
          pushed=
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
          done
          [ -n "$pushed" ] || { echo "couldn't push the prebuilt firmware"; exit 1; }
          # Pushes made with the workflow token don't start other workflows;
          # start the tests on the new commit explicitly.
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/dispatches" \
            -d "{\"ref\": \"${GITHUB_REF_NAME}\"}"
